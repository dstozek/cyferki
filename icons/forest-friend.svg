<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <radialGradient id="glow"><stop stop-color="#d9cb82" stop-opacity=".25"/><stop offset="1" stop-color="#d9cb82" stop-opacity="0"/></radialGradient>
    <linearGradient id="leaf" x1=".18" y1=".12" x2=".84" y2=".92"><stop stop-color="#c8bd6e"/><stop offset="1" stop-color="#71864b"/></linearGradient>
    <linearGradient id="wood" x1=".15" y1="0" x2=".9" y2="1"><stop stop-color="#c18e53"/><stop offset="1" stop-color="#87613c"/></linearGradient>
  </defs>
  <circle cx="60" cy="60" r="57" fill="url(#glow)"/>
