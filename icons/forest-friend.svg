    <path d="M42 39c9 3 23 3 38 0" fill="none" stroke="#e0d698" stroke-opacity=".65" stroke-width="1.4"/>
    <ellipse cx="51" cy="49" rx="2" ry="3" fill="#263a2b" stroke="none"/>
